version: "3.9"

services:
  backend:
    image: jogadoresanonimos/backend:latest
    networks:
      - ja
      - backend-internal
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      LOG_HMAC_SECRET: ${LOG_HMAC_SECRET}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      STORAGE_STUB_DIR: /app/data/imagens
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      ADMIN_BOOTSTRAP_APELIDO: ${ADMIN_BOOTSTRAP_APELIDO}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_SENHA: ${ADMIN_BOOTSTRAP_SENHA}
      ADMIN_LIMITE_MAXIMO: ${ADMIN_LIMITE_MAXIMO}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
    volumes:
      - backend_storage:/app/data/imagens
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 400M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=ja
        - traefik.http.routers.jaa-backend.rule=Host(`api.jogadoresanonimos.com.br`)
        - traefik.http.routers.jaa-backend.entrypoints=websecure
        - traefik.http.routers.jaa-backend.tls.certresolver=letsencryptresolver
        - traefik.http.services.jaa-backend.loadbalancer.server.port=8080

  postgres:
    image: postgres:16-alpine
    networks:
      - backend-internal
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=20"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 200M
        reservations:
          cpus: "0.25"
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: stop-first

networks:
  ja:
    external: true
  backend-internal:
    driver: overlay
    internal: true

volumes:
  postgres_data:
  backend_storage:

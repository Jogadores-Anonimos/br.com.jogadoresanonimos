<header class="app-header-sticky" [class.com-barra-deslizante]="mostrarBarraDeslizante()">
  <app-navbar></app-navbar>
  @if (mostrarBarraDeslizante()) {
    <app-barra-deslizante
      [messages]="[
        'EVITE A PRIMEIRA APOSTA. EVITE PESSOAS E LUGARES DE ATIVA. SÓ POR HOJE. FREQUENTE O MAIOR NÚMERO DE REUNIÕES POSSÍVEIS. AS REUNIÕES PRODUZEM RECUPERAÇÃO.',
        'UM DIA DE CADA VEZ.',
        'PERMITA-SE PEDIR AJUDA. SÓ FORÇA DE VONTADE NÃO É SUFICIENTE PARA SUPERAR O JOGO COMPULSIVO.'
      ]"
    ></app-barra-deslizante>
  }
</header>
@if (auth.usuarioAtual() && auth.usuarioAtualDetalhado()?.emailConfirmado === false) {
  <app-aviso-email-nao-confirmado
    mensagemContexto="Confirme seu e-mail para garantir a recuperação da sua conta."
  ></app-aviso-email-nao-confirmado>
}
<main>
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>
<app-whatsapp-flutuante></app-whatsapp-flutuante>
<app-voltar-ao-topo></app-voltar-ao-topo>

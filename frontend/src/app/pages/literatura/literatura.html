<div class="literatura-page">

  <div class="literatura-hero">
    <span class="literatura-label">MATERIAL DE APOIO</span>
    <h1>Literatura</h1>
    <p>Conheça os livros e folhetos utilizados por Jogadores Anônimos para apoiar a jornada de recuperação.</p>
  </div>

  <div class="literatura-container">

    <div class="literatura-filtros">
      <button class="filtro-btn" [class.active]="filtroAtivo === 'todos'" (click)="filtroAtivo = 'todos'">
        Todos
      </button>
      <button class="filtro-btn" [class.active]="filtroAtivo === 'livro'" (click)="filtroAtivo = 'livro'">
        <i class="ti ti-book"></i> Livros
      </button>
      <button class="filtro-btn" [class.active]="filtroAtivo === 'folheto'" (click)="filtroAtivo = 'folheto'">
        <i class="ti ti-file-text"></i> Folhetos
      </button>
    </div>

    <div class="literatura-grid">
      @for (item of literaturasFiltradas; track $index) {
        <div class="literatura-card">
          <div class="literatura-card-img">
            <img [src]="item.imagem" [alt]="item.titulo" loading="lazy"
                 onerror="this.style.display='none'; this.parentElement.classList.add('sem-imagem')">
            <span class="literatura-tipo" [class.livro]="item.tipo === 'livro'">
              {{ item.tipo === 'livro' ? 'Livro' : 'Folheto' }}
            </span>
          </div>
          <div class="literatura-card-body">
            <p class="literatura-formato">
              <i class="ti ti-ruler"></i> {{ item.formato }}
            </p>
            <h3>{{ item.titulo }}</h3>
            <p class="literatura-desc">{{ item.descricao }}</p>
          </div>
        </div>
      }
    </div>

  </div>

</div>

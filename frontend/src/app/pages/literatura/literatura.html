<app-resource-layout titulo="Literatura">

  <section class="section">
    <div class="literatura-grid">
      @for (item of publicacoes; track item.titulo) {
        <div class="literatura-card">
          <img class="literatura-capa" [src]="item.imagem" [alt]="item.titulo">
          <h2>{{ item.titulo }}</h2>
          <span class="literatura-formato">{{ item.formato }}</span>
          <p class="literatura-descricao">{{ item.descricao }}</p>
        </div>
      }
    </div>
  </section>

  <section class="cta-final">
    <h2>Quer entender melhor o programa?</h2>
    <p>
      Conheça as perguntas mais frequentes sobre a recuperação do jogo
      compulsivo e o funcionamento da irmandade.
    </p>
    <a class="btn-cta" routerLink="/perguntas-e-respostas">
      Ver Perguntas &amp; Respostas
    </a>
  </section>

</app-resource-layout>

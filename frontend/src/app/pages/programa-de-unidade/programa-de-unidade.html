<app-resource-layout titulo="Programa da Unidade (12 Passos da Unidade)">

  <section class="section conteudo-cms">
    @for (bloco of blocosTexto(); track bloco.ordem) {
      <div [innerHTML]="bloco.conteudo"></div>
    }
  </section>

  <section class="cta-final">
    <h2>Ajude a manter viva essa mensagem</h2>
    <p>
      A Jogadores Anônimos se sustenta exclusivamente com as contribuições
      voluntárias de seus próprios membros e amigos.
    </p>
    <a class="btn-cta" routerLink="/contribuir">Fazer uma Contribuição</a>
  </section>

</app-resource-layout>

<app-resource-layout titulo="Programa de Recuperação (Os 12 Passos)">

  <section class="section conteudo-cms">
    @for (bloco of blocosTexto(); track bloco.ordem) {
      <div [innerHTML]="bloco.conteudo"></div>
    }
  </section>

  <section class="cta-final">
    <h2>Pronto para dar o primeiro passo?</h2>
    <p>
      Ninguém precisa percorrer esse caminho sozinho. Encontre uma reunião e
      conheça pessoas que entendem exatamente o que você está passando.
    </p>
    <a class="btn-cta" routerLink="/reunioes">Encontrar uma Reunião</a>
  </section>

</app-resource-layout>

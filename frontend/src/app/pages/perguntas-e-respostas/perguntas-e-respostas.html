<app-resource-layout titulo="Perguntas &amp; Respostas">

  <section class="section">
    <h2 class="faq-titulo">Perguntas Frequentes</h2>

    <div class="faq-lista">
      @for (item of faqs; track item.pergunta) {
        <details class="faq-item">
          <summary class="faq-pergunta">
            {{ item.pergunta }}
            <span class="faq-pergunta__chevron" aria-hidden="true"></span>
          </summary>
          <p class="faq-resposta">{{ item.resposta }}</p>
        </details>
      }
    </div>
  </section>

</app-resource-layout>

# Perfil usado apenas por testes de integração de repository
# (qa-backend-integration). O datasource é o container Postgres efêmero
# subido via Testcontainers em cada classe de teste (@DynamicPropertySource
# sobrescreve spring.datasource.* em tempo de execução) — nunca o banco de
# desenvolvimento/produção do docker-compose.yml.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
